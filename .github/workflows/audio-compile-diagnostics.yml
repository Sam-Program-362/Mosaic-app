name: Audio compile diagnostics (one-time)

# One-time: surfaces Kotlin compiler errors as annotations, which are the
# only build output readable from the agent sandbox.
on:
  push:
    branches: ['arena/a0a1b100-mosaic-app']
    paths: ['.github/workflows/audio-compile-diagnostics.yml']

permissions:
  contents: read

jobs:
  compile:
    name: Compile and report errors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tail -2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile main and unit-test Kotlin, annotating errors
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --console=plain > build.log 2>&1
          CODE=$?
          echo "gradle exit code: $CODE"
          python3 - <<'PYEOF'
          import pathlib
          lines = pathlib.Path('build.log').read_text(errors='replace').splitlines()
          errors = [l for l in lines if l.startswith('e: ') or ': error:' in l]
          if not errors:
              errors = [l for l in lines if 'FAILED' in l or 'What went wrong' in l][:10]
          for line in errors[:40]:
              msg = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=Kotlin compile::{msg[:900]}")
          if not errors:
              tail = "\n".join(lines[-30:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=Build log tail::{tail[:4000]}")
          PYEOF
          exit $CODE
