name: Signing recovery (one-time, old branch)

# One-time, user-approved investigation running under the previous branch's ref so
# GitHub's branch-scoped cache rules permit restoring that branch's debug-signing
# cache. Restore-only: an exact cache hit is required; on a miss the job stops.
# The keystore is never printed, exported, uploaded, or committed; only public
# certificate fingerprints are logged. Development debug key only — never use
# for production or release signing.
on:
  push:
    branches: ['arena/b0f3e3cf-mosaic-app']
    paths: ['.github/workflows/signing-investigation-oldkey.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    cache-mode: read
    env:
      OLD_RUN_ID: '38624705844'
      PHASE6_SHA: '69d34df813ad3dff91c6a5405d7921555280b005'
      EXPECTED_FP: '8f341e94dfdcfc0b6603578aba59b0bd627caef4d27ef2825c800f1c72868b79'
      # Google's publicly documented default password for Android *debug* keystores.
      # Development only; not a production credential. Used only via env expansion.
      DEBUG_KEYSTORE_PASS: 'android'
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform and build tools
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download installed-version artifact (run 38624705844)
        uses: actions/download-artifact@v5
        with:
          name: mosaic-debug-and-reports
          run-id: ${{ env.OLD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: old-installed

      - name: Confirm installed APK fingerprint matches the expected value
        id: fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OLD_APK=$(find old-installed -name 'app-debug.apk' | head -1)
          test -n "$OLD_APK"
          "$APKSIGNER" verify "$OLD_APK"
          OLD_FP=$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "::notice title=Old APK certificate SHA-256::$OLD_FP"
          if [ "$OLD_FP" != "$EXPECTED_FP" ]; then
            echo "::error title=Signing recovery::Installed APK fingerprint differs from the expected verified fingerprint. Stopping."
            exit 1
          fi
          echo "::notice title=Installed APK fingerprint::Confirmed against expected value"

      - name: Restore this branch's debug keystore (restore-only, exact hit required)
        id: oldkey
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: mosaic-debug-signing-arena/b0f3e3cf-mosaic-app-v1
          fail-on-cache-miss: true

      - name: Fingerprint restored keystore certificate
        id: keystore
        if: steps.oldkey.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass "$DEBUG_KEYSTORE_PASS" | sed -n 's/.*SHA256: //p' | head -1)
          KEY_FP=$(echo "$RAW" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          test -n "$KEY_FP"
          echo "::notice title=Restored keystore certificate SHA-256::$KEY_FP"
          if [ "$KEY_FP" = "$EXPECTED_FP" ]; then
            echo "::notice title=Keystore vs installed APK::MATCH"
            echo "key_matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Keystore vs installed APK::DIFFER"
            echo "key_matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if restored key does not match the installed APK
        if: steps.oldkey.outputs.cache-hit == 'true' && steps.keystore.outputs.key_matches != 'true'
        run: |
          echo "::error title=Signing recovery::Restored keystore certificate does not match the installed APK. Stopping without a rebuild; no fallback key will be generated."
          exit 1

      - name: Check out Phase 6 source (69d34df)
        if: steps.keystore.outputs.key_matches == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PHASE6_SHA }}
          path: phase6-src

      - name: Build Phase 6 debug APK with the restored key
        if: steps.keystore.outputs.key_matches == 'true'
        working-directory: phase6-src
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify rebuilt APK certificate
        id: rebuilt
        if: steps.keystore.outputs.key_matches == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          NEW_APK=phase6-src/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify "$NEW_APK"
          NEW_FP=$("$APKSIGNER" verify --print-certs "$NEW_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "::notice title=Rebuilt Phase 6 APK certificate SHA-256::$NEW_FP"
          if [ "$NEW_FP" != "$EXPECTED_FP" ]; then
            echo "::error title=Signing recovery::Rebuilt APK certificate does not match the installed APK. Not publishing."
            exit 1
          fi
          echo "::notice title=Rebuilt APK verification::Certificate matches installed APK exactly"
          sha256sum "$NEW_APK" > phase6-src/app/build/outputs/apk/debug/app-debug.sha256
          NEW_SHA=$(cut -d' ' -f1 phase6-src/app/build/outputs/apk/debug/app-debug.sha256)
          echo "::notice title=Rebuilt Phase 6 APK file SHA-256::$NEW_SHA"

      - name: Upload rebuilt Phase 6 APK and checksum only
        if: steps.keystore.outputs.key_matches == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: mosaic-phase6-installed-key-build
          path: |
            phase6-src/app/build/outputs/apk/debug/app-debug.apk
            phase6-src/app/build/outputs/apk/debug/app-debug.sha256
          if-no-files-found: error
