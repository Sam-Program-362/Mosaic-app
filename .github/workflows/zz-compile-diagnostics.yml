name: One-time compile diagnostics (viewer chrome)

on:
  push:
    branches: ['arena/a0a1b100-mosaic-app']
    paths: ['.github/workflows/zz-compile-diagnostics.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null 2>&1 || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile main and unit-test Kotlin, annotate errors
        shell: bash
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin > compile.log 2>&1
          STATUS=$?
          python3 - <<'PYEOF'
          from pathlib import Path
          lines = [l for l in Path('compile.log').read_text(errors='replace').splitlines()
                   if l.startswith('e: ') or 'error:' in l.lower()][:40]
          for l in lines:
              msg = l.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:900]
              print(f'::error title=Kotlin compile::{msg}')
          if not lines:
              tail = Path('compile.log').read_text(errors='replace')[-3000:]
              msg = tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Compile log tail::{msg}')
          PYEOF
          echo "gradle-status=$STATUS"
          exit 0
